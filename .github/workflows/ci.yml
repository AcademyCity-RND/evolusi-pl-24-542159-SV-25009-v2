name: Continuous Integration

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ 'main', 'dev' ]
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

  test:
    name: Automated Unit & Feature Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PNPM Package Manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Install Frontend Dependencies
        run: pnpm install
      - name: Compile Frontend Assets (Vite)
        run: pnpm run build
      - name: Prepare Application Environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run PHPUnit Test Suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  staging:
    name: Deploy to Staging
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Echo Staging Deploy
        run: echo "Mengirim kode ke server staging untuk pengujian internal..."

  production:
    name: Deploy to Production
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Execute 7 Deployment Steps
        run: |
          echo "1. Memasuki mode maintenance (php artisan down)..."
          echo "2. Menarik kode terbaru dari branch main (git pull)..."
          echo "3. Menginstall dependensi backend (composer install)..."
          echo "4. Menjalankan migrasi database (php artisan migrate)..."
          echo "5. Membangun aset frontend (pnpm run build)..."
          echo "6. Melakukan caching konfigurasi dan rute Laravel..."
          echo "7. Mengembalikan ke mode aktif (php artisan up)..."
